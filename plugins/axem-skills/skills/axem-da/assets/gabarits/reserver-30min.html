<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Réserver 30 min AXEM</title>
<link rel="stylesheet" href="axem-kit.css">
<style>
  html, body { overflow: hidden; background: var(--blue); }
  .card { position: relative; width: var(--W); height: var(--H); background: var(--blue); color: var(--cream); overflow: hidden; }
  .logo { position: absolute; left: var(--pad); top: calc(var(--pad) * 0.85); font-size: calc(var(--u) * 5.2); }
  .kick { position: absolute; left: var(--pad); font-size: calc(var(--u) * 1.45); opacity: 0.92; }
  .h { position: absolute; left: var(--pad); font-size: calc(var(--u) * 7.4); line-height: 0.92; }
  .h .i { font-weight: 400; }
  .cta { position: absolute; left: var(--pad); display: inline-flex; align-items: center; gap: 0.6em; background: var(--cream); color: var(--blue); font-weight: 700; font-size: calc(var(--u) * 2.1); padding: 0.62em 1.05em 0.62em 1.15em; border-radius: 999px; }
  .cta svg { width: 1em; height: 1em; }
  /* La grille de créneaux du calendrier */
  .slots { position: absolute; display: grid; gap: calc(var(--u) * 1.1); }
  .slots i { display: block; width: var(--s); height: var(--s); box-shadow: inset 0 0 0 calc(var(--u) * 0.28) var(--line-cream); }
  .slots i.on { background: var(--cream); box-shadow: none; display: grid; place-items: center; color: var(--blue); font-family: 'Fraunces', serif; font-weight: 900; font-variation-settings: "SOFT" 100, "opsz" 144; font-size: calc(var(--s) * 0.46); letter-spacing: -0.03em; }
  .slots b { font-family: 'Instrument Sans'; font-weight: 600; font-size: calc(var(--u) * 1.15); letter-spacing: 0.12em; text-align: center; opacity: 0.8; }

  /* Paysage 1200 x 627 (Sélection LinkedIn, aperçu de lien) */
  body[data-f="paysage"] { --W: 1200px; --H: 627px; --u: 10px; --pad: 64px; --s: 64px; }
  body[data-f="paysage"] .kick { top: 170px; }
  body[data-f="paysage"] .h { top: 212px; }
  body[data-f="paysage"] .cta { bottom: 60px; }
  body[data-f="paysage"] .slots { right: 64px; top: 150px; grid-template-columns: repeat(5, auto); }

  /* Vertical 1080 x 1350 (post, carrousel de fin) */
  body[data-f="vertical"] { --W: 1080px; --H: 1350px; --u: 13px; --pad: 84px; --s: 150px; }
  body[data-f="vertical"] .kick { top: 250px; }
  body[data-f="vertical"] .h { top: 305px; font-size: calc(var(--u) * 9.4); }
  body[data-f="vertical"] .cta { bottom: 90px; }
  body[data-f="vertical"] .slots { left: 84px; bottom: 210px; grid-template-columns: repeat(5, auto); }

  /* Carré 1080 x 1080 */
  body[data-f="carre"] { --W: 1080px; --H: 1080px; --u: 12px; --pad: 80px; --s: 70px; }
  body[data-f="carre"] .kick { top: 230px; }
  body[data-f="carre"] .h { top: 280px; font-size: calc(var(--u) * 8.6); }
  body[data-f="carre"] .cta { bottom: 80px; }
  body[data-f="carre"] .slots { right: 80px; bottom: 80px; grid-template-columns: repeat(5, auto); }
</style></head>
<body>
<div class="card">
  <span class="logo wm">axem<sup>IA</sup></span>
  <span class="kick kicker">Échange offert · 30 minutes · en visio</span>
  <h1 class="h f">Votre projet IA,<br><span class="i">cadré en</span> 30&nbsp;min.</h1>
  <span class="cta">Réserver mon créneau
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  <div class="slots" id="slots"></div>
</div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  document.body.dataset.f = q.get('f') || 'paysage';
  const s = document.getElementById('slots');
  ['L','M','M','J','V'].forEach(d => { const b = document.createElement('b'); b.textContent = d; s.appendChild(b); });
  for (let k = 0; k < 15; k++) { const i = document.createElement('i'); if (k === 7) { i.className = 'on'; i.textContent = '30'; } s.appendChild(i); }
</script>
</body></html>
