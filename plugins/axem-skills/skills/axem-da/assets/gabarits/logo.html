<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Kit logo AXEM</title>
<link rel="stylesheet" href="axem-kit.css">
<script src="monogramme-path.js"></script>
<style>
  body { background: transparent; padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .lg { padding: 0.18em 0.12em 0.14em 0.08em; font-size: 320px; background: transparent; }
  .sqr { width: 1080px; height: 1080px; display: grid; place-items: center; position: relative; }
  .sqr .wm { font-size: 250px; }
  .sqr .foot { position: absolute; left: 56px; bottom: 56px; font-size: 38px; }
  .sqr .top { position: absolute; left: 56px; top: 52px; font-size: 26px; }
  .ico { width: 512px; height: 512px; display: grid; place-items: center; }
  .ico .f { font-size: 400px; line-height: 1; transform: translateY(-4%); letter-spacing: 0; }
  .lock { padding: 40px; display: inline-flex; flex-direction: column; gap: 22px; }
  .lock .wm { font-size: 200px; }
  .lock .tag { font-size: 44px; letter-spacing: -0.01em; }
  /* Monogramme "ax" : vectorise depuis le masque d'Alexis (site-A/img/logo-ax-mask.png), jamais un raster agrandi */
  .mono-solo { padding: 40px; }
  .mono-solo .mono-slot { width: 900px; }
  .mono-slot svg { width: 100%; height: auto; display: block; }
  .bloc-mono { padding: 50px; display: inline-flex; flex-direction: column; align-items: center; gap: 46px; }
  .bloc-mono .mono-slot { width: 560px; }
  .bloc-mono .wm { font-size: 168px; }
</style></head><body>
  <div id="logo-bleu" class="lg c-blue"><span class="wm">axem<sup>IA</sup></span></div>
  <div id="logo-creme" class="lg c-cream"><span class="wm">axem<sup>IA</sup></span></div>
  <div id="logo-encre" class="lg" style="color:var(--ink)"><span class="wm">axem<sup>IA</sup></span></div>

  <div id="carre-bleu" class="sqr bg-blue">
    <span class="kicker top">Votre partenaire IA, de A à Z</span>
    <span class="wm">axem<sup>IA</sup></span>
  </div>
  <div id="carre-creme" class="sqr bg-cream">
    <span class="kicker top c-blue">Votre partenaire IA, de A à Z</span>
    <span class="wm c-blue">axem<sup>IA</sup></span>
  </div>
  <div id="carre-encre" class="sqr bg-ink">
    <span class="kicker top">Votre partenaire IA, de A à Z</span>
    <span class="wm">axem<sup>IA</sup></span>
  </div>

  <div id="icone-bleu" class="ico bg-blue"><span class="f">a</span></div>
  <div id="icone-creme" class="ico bg-cream c-blue"><span class="f">a</span></div>

  <div id="logo-accroche-bleu" class="lock c-blue">
    <span class="wm">axem<sup>IA</sup></span>
    <span class="tag i" style="color:var(--ink)">Votre partenaire IA, de A à Z.</span>
  </div>
  <div id="logo-accroche-creme" class="lock c-cream">
    <span class="wm">axem<sup>IA</sup></span>
    <span class="tag i">Votre partenaire IA, de A à Z.</span>
  </div>

  <!-- Monogramme "ax" seul, vectorise depuis le masque d'Alexis : signature des supports physiques et visuels -->
  <div id="monogramme-bleu" class="mono-solo c-blue"><span class="mono-slot"></span></div>
  <div id="monogramme-creme" class="mono-solo c-cream"><span class="mono-slot"></span></div>
  <div id="monogramme-encre" class="mono-solo" style="color:var(--ink)"><span class="mono-slot"></span></div>

  <!-- Bloc complet : monogramme au-dessus du mot axem IA, comme la reference logo-ax-source.png -->
  <div id="bloc-monogramme-bleu" class="bloc-mono c-blue"><span class="mono-slot"></span><span class="wm">axem<sup>IA</sup></span></div>
  <div id="bloc-monogramme-creme" class="bloc-mono c-cream"><span class="mono-slot"></span><span class="wm">axem<sup>IA</sup></span></div>
  <div id="bloc-monogramme-encre" class="bloc-mono" style="color:var(--ink)"><span class="mono-slot"></span><span class="wm">axem<sup>IA</sup></span></div>

<script>
  document.querySelectorAll('.mono-slot').forEach(el => {
    el.innerHTML = `<svg viewBox="${window.AXEM_MONO_VB}" xmlns="http://www.w3.org/2000/svg"><path d="${window.AXEM_MONO_D}" fill="currentColor" fill-rule="evenodd"/></svg>`;
  });
</script>
</body></html>
