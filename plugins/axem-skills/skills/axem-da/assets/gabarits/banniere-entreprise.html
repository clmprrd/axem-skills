<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bannière page entreprise AXEM</title>
<link rel="stylesheet" href="axem-kit.css">
<style>
  /* Page entreprise LinkedIn : 1128 x 191. Le logo carré recouvre le coin bas gauche : rien d'important à gauche. */
  html, body { width: 1128px; height: 191px; overflow: hidden; }
  .b { position: absolute; inset: 0; background: var(--blue); color: var(--cream); overflow: hidden; }
  .ga { position: absolute; left: 230px; bottom: -40px; font-size: 300px; color: var(--blue-deep); line-height: 0.8; }
  .gz { position: absolute; right: -24px; top: -46px; font-size: 300px; color: var(--blue-deep); line-height: 0.8; }
  .tag { position: absolute; left: 360px; top: 58px; font-size: 44px; line-height: 1; }
  .tag .i { font-weight: 400; }
  .k { position: absolute; left: 362px; top: 118px; font-size: 12px; opacity: 0.9; }
  .sq2 { position: absolute; right: 56px; bottom: 34px; font-size: 16px; }
</style></head><body>
<div class="b">
  <span class="ga f">A</span><span class="gz f">Z</span>
  <h1 class="tag f">Votre partenaire IA, <span class="i">de A à Z.</span></h1>
  <span class="k kicker">Audit · Formation · Automatisation · axem-ia.fr</span>
  <span class="sq2"><i></i><i></i></span>
</div>
</body></html>
