<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Cartes de visite AXEM</title>
<link rel="stylesheet" href="axem-kit.css">
<script src="monogramme-path.js"></script>
<style>
  /* 85 x 55 mm + 3 mm de fond perdu = 91 x 61 mm. Textes à 5 mm au moins du trait de coupe. */
  @page { size: 91mm 61mm; margin: 0; }
  html, body { background: #fff; }
  .c { width: 91mm; height: 61mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; }
  .c:last-child { page-break-after: auto; }
  .recto { background: var(--blue); color: var(--cream); display: grid; place-items: center; }
  .recto .bloc { display: flex; flex-direction: column; align-items: center; gap: 3.2mm; }
  .recto .mono-slot { width: 22mm; }
  .recto .mono-slot svg { width: 100%; height: auto; display: block; }
  .recto .wm { font-size: 15pt; }
  .verso { background: var(--cream); color: var(--ink); }
  .verso .n { position: absolute; left: 11mm; top: 11mm; font-size: 17pt; }
  .verso .r { position: absolute; left: 11mm; top: 20mm; font-size: 6.5pt; color: var(--blue); }
  .verso .co { position: absolute; left: 11mm; bottom: 10mm; font-size: 7.5pt; line-height: 1.6; color: var(--grey); }
  .verso .co b { color: var(--ink); font-weight: 600; }
  .verso .tag { position: absolute; right: 11mm; bottom: 15.5mm; font-size: 7pt; text-align: right; color: var(--blue); max-width: 30mm; }
  .verso .wm { position: absolute; right: 11mm; bottom: 10mm; font-size: 13pt; color: var(--blue); }
</style></head><body>
<div id="d"></div>
<script>
  // #nom=Prénom Nom & role=… & tel=… & mail=… ; téléphone et mail restent à compléter tant qu'ils ne sont pas fournis
  const q = new URLSearchParams(location.hash.slice(1));
  const P = q.get('nom') || 'Prénom Nom';
  document.getElementById('d').innerHTML = `
  <div class="c recto"><div class="bloc"><span class="mono-slot"></span><span class="wm">axem<sup>IA</sup></span></div></div>
  <div class="c verso"><span class="n f">${P}</span><span class="r kicker">${q.get('role') || 'Cofondateur, AXEM IA'}</span>
    <div class="co"><b>${q.get('tel') || 'TÉLÉPHONE À COMPLÉTER'}</b><br>${q.get('mail') || 'MAIL À COMPLÉTER'}<br>axem-ia.fr</div>
    <span class="tag i">Votre partenaire IA, de A à Z.</span>
    <span class="wm">axem<sup>IA</sup></span></div>`;
  document.querySelectorAll('.mono-slot').forEach(el => {
    el.innerHTML = `<svg viewBox="${window.AXEM_MONO_VB}" xmlns="http://www.w3.org/2000/svg"><path d="${window.AXEM_MONO_D}" fill="currentColor" fill-rule="evenodd"/></svg>`;
  });
</script>
</body></html>
